    <polyline points="20,160 55,150 90,132 125,125 160,112 195,98 230,96 265,82 300,70" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="4 5"/>
    <text x="150" y="40" class="mono" font-size="14" fill="#8b949e">E[X] &gt; 0</text>
  </g>

  <g transform="translate(1000,92) rotate(-6)">
    <rect width="96" height="134" rx="8" fill="url(#cardface)" stroke="#484f58" stroke-width="1.2"/>
    <rect x="6" y="6" width="84" height="122" rx="5" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="32" class="serif" font-size="22" fill="#e6edf3">A</text>
    <text x="14" y="52" font-size="16" fill="#e6edf3">♠</text>
    <text x="42" y="88" text-anchor="middle" font-size="30" fill="#c9d1d9">♠</text>
    <text x="82" y="120" text-anchor="middle" class="serif" font-size="22" fill="#e6edf3" transform="rotate(180 82 113)">A</text>
  </g>
  <g transform="translate(1078,106) rotate(5)">
    <rect width="96" height="134" rx="8" fill="url(#cardface)" stroke="#484f58" stroke-width="1.2"/>
    <rect x="6" y="6" width="84" height="122" rx="5" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="32" class="serif" font-size="22" fill="#f47067">K</text>
    <text x="14" y="52" font-size="16" fill="#f47067">♥</text>
    <text x="48" y="86" text-anchor="middle" font-size="30" fill="#e5534b">♥</text>
    <text x="82" y="120" text-anchor="middle" class="serif" font-size="22" fill="#f47067" transform="rotate(180 82 113)">K</text>
