      <line x1="55" y1="110" x2="55" y2="175" stroke="#2ea043"/><rect x="48" y="125" width="14" height="38" fill="#2ea043"/>
      <line x1="90" y1="95" x2="90" y2="160" stroke="#2ea043"/><rect x="83" y="105" width="14" height="40" fill="#2ea043"/>
      <line x1="125" y1="100" x2="125" y2="150" stroke="#c9453f"/><rect x="118" y="108" width="14" height="28" fill="#c9453f"/>
      <line x1="160" y1="80" x2="160" y2="140" stroke="#2ea043"/><rect x="153" y="90" width="14" height="38" fill="#2ea043"/>
      <line x1="195" y1="70" x2="195" y2="125" stroke="#2ea043"/><rect x="188" y="78" width="14" height="36" fill="#2ea043"/>
      <line x1="230" y1="75" x2="230" y2="120" stroke="#c9453f"/><rect x="223" y="82" width="14" height="26" fill="#c9453f"/>
      <line x1="265" y1="55" x2="265" y2="110" stroke="#2ea043"/><rect x="258" y="62" width="14" height="36" fill="#2ea043"/>
