  <rect width="780" height="290" fill="url(#fade)"/>
  <rect width="1200" height="290" fill="url(#vignette)"/>

  <text x="60" y="104" class="mono" font-size="17" fill="#4b5563">sahil@purdue:~$ <tspan fill="#6b7280">./profile</tspan></text>
  <text x="57" y="172" class="mono" font-size="60" font-weight="700" fill="#d1d7de" letter-spacing="3">SAHIL JAIN</text>
  <text x="60" y="218" class="mono" font-size="18" fill="#6b7280">Data Science (CS) @ Purdue <tspan fill="#2d333b">|</tspan> Math minor</text>
  
  <rect y="290" width="1200" height="50" fill="#0e1218"/>
  <line x1="0" y1="290" x2="1200" y2="290" stroke="#1b2129"/>
  <text y="321" class="mono" font-size="15" fill="#4b5563">
    <tspan x="40">P(win)</tspan>
    <tspan dx="40">POT ODDS 3:1</tspan>
    <tspan dx="40">EV</tspan>
    <tspan dx="40" fill="#6b7280">♠ ♥ ♦ ♣</tspan>
