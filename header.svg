<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Sahil Jain — Data Science at Purdue">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#11161d" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="0.5" stop-color="#0a0d12" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0a0d12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d12" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0d12" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262d37"/>
      <stop offset="1" stop-color="#181d24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#0a0d12"/>
  <rect width="1200" height="290" fill="url(#grid)"/>

  <g transform="translate(720,40)">
